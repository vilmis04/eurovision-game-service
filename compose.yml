# LOCAL DEVELOPMENT ONLY. Production runs the image built by CI (see README).
#
#   cp .env.example .env
#   docker compose up -d db          # just the database, then `make run`
#   docker compose up -d             # database + the service in a golang container
#   docker compose --profile proxy up -d   # also build and start the auth proxy
#
# Everything is published on 127.0.0.1 only.
services:
  go-service:
    container_name: go-service
    # build: .   # to run the production image instead of mounting the source
    image: golang:1.24-alpine
    tty: true
    working_dir: /code
    restart: always
    ports:
      - "127.0.0.1:4200:4200"
    env_file:
      - .env
    environment:
      # inside the compose network the database is reached by its service name
      DATABASE_URL: postgres://${POSTGRES_USER:-evgame}:${POSTGRES_PASSWORD:-evgame}@db:5432/${POSTGRES_DB:-evgame}
    volumes:
      - .:/code
    depends_on:
      - db

  # Optional: the auth proxy from https://github.com/vilmis04/auth-proxy.
  # By default it is built straight from GitHub. To use a local checkout instead set
  # AUTH_PROXY_CONTEXT=/path/to/auth-proxy in .env. Configure it in .env.auth
  # (see .env.auth.example); it must send the same INTERNAL_TOKEN as .env.
  auth-proxy:
    profiles: ["proxy"]
    container_name: auth-proxy
    build: ${AUTH_PROXY_CONTEXT:-https://github.com/vilmis04/auth-proxy.git#master}
    tty: true
    restart: always
    ports:
      - "127.0.0.1:4300:4300"
    env_file:
      - .env.auth

  # client:
  #   container_name: client
  #   image: vsud/ev-game:client-2.1.1
  #   tty: true
  #   restart: always
  #   ports:
  #     - "3300:3300"

  db:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  admin:
    container_name: admin
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:5555:8080"

volumes:
  pgdata:
